<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presto - Annunci</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <!-- NAVBAR -->
  <nav id="navbar" class="navbar navbar-expand-lg bg-black navbar-dark">
    <div class="container-fluid">
      
      <a class="navbar-brand" href="#">
        <img id="logonavbar" src="./mediap/logoyellow.png" alt="logo del sito" class="logo" style="max-height: 40px;">
      </a>
      
      <button class="navbar-toggler border-0 bg-transparent ms-auto"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <img id="spadayellow" src="./mediap/spadayellow.png" class="img-fluid logo2" alt="spada laser" style="max-height: 40px;">
      </button>
      
      <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="./index.html">home</a></li>
          <li class="nav-item"><a class="nav-link" href="./annunci.html">annunci</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Chi siamo</a></li>
        </ul>
      </div>
      
    </div>
  </nav>
  <!-- NAVBAR END -->
  
  <main class="container my-5">
    <h1 class="mb-4">Pagina degli annunci</h1>
    
    <div class="row">
      
      <aside class="col-12 col-md-3 mb-4">
        <h3>Filtra per:</h3>
        
        <div class="accordion sticky-top" id="accordionExample">
          
          <!-- Categoria -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                Categoria
              </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
              <div id="radiowrapper" class="accordion-body">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="categories" id="all" checked>
                  <label class="form-check-label" for="all">
                    Tutte le categorie
                  </label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="categories" id="radioDefault1">
                  <label class="form-check-label" for="radioDefault1">
                    Default radio
                  </label>
                </div>
              </div>
            </div>
          </div>
          
          <!-- Prezzo -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                Prezzo
              </button>
            </h2>
            <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
              <div class="accordion-body">
              <input id="priceinput" type="range" class="w-100" value="500" min="0" max="1000">
               <p class="lead" id="pricevalue">0</p> 
              </div>
            </div>
          </div>
          
          <!-- Parola -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                Parola
              </button>
            </h2>
            <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <input id="wordinput" type="text">
              </div>
            </div>
          </div>
          
        </div>
      </aside>
      
     
      <section class="col-12 col-md-9">
        <div id="cardwrapper" class="row g-3">
        </div>
      </section>
      
    </div>
  </main>
  
  <!-- JS Scripts -->
  <script src="https://kit.fontawesome.com/e881758d68.js" crossorigin="anonymous"></script>
  <!-- Bootstrap Bundle include Popper.js per i menu a tendina -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./annunci.js"></script>
  
</body>
</html>
